name: CI

# Nothing ran on a normal push. Tests and the pre-publish checks only fired on a v* tag,
# which meant a broken commit sat on main undiscovered until release time — and by then the
# fix is a version bump, because npm will not let a version be republished.
#
# This runs the same checks on every push and pull request, publishing nothing.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Three operating systems, because for nine releases the suite only ever ran on Linux
    # and that was invisible. The first time it ran on Windows, 36 tests failed and one of
    # them was a real product bug: `which()` could not find any binary at all, so preflight
    # told every Windows user their environment was empty.
    #
    # "All tests pass" is a claim about wherever the tests ran. This is what makes the claim
    # mean what it sounds like.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      # The same eight checks the release runs, including the runtime probe that stubs
      # http/https/net/tls/fetch and fails if a free audit opens a socket. Running them here
      # means a change that would break publishing is caught on the commit that caused it,
      # not on the tag weeks later.
      - run: npm run pack:cli

      # The committed bundle must match the source. `cli/dist/enforcee.mjs` is a build
      # artefact that is ALSO committed, so the two can drift — and on 2026-08-16 they did:
      # a parser fix shipped with a stale bundle, tests green throughout, because every test
      # imports the source and none of them touch the bundle. Anyone running the shipped
      # binary from that commit got the old behaviour.
      #
      # `pack:cli` above has just rebuilt it, so a dirty tree here means the commit carries
      # a bundle that does not correspond to its own source. Ubuntu only: one platform is
      # enough to establish the fact, and esbuild output can differ trivially across OSes.
      - name: The committed CLI bundle is not stale
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! git diff --quiet -- cli/dist/enforcee.mjs; then
            echo "::error::cli/dist/enforcee.mjs is stale — rebuilt output differs from the commit."
            git diff --stat -- cli/dist/enforcee.mjs
            exit 1
          fi

      - run: npm run build

      # ── The two controls we built after the two worst incidents, and then ran nowhere ──
      #
      # Both of these existed, passed, and were wired into nothing. They were a thing someone
      # had to remember to type, which is precisely the category of control this product
      # exists because models ignore. Checked 2026-08-15:
      #   grep -c 'selfcheck|verify:ui' .github/workflows/ci.yml  ->  0
      #
      # `selfcheck` runs `health` + `preflight` over our own CLAUDE.md. Its first ever run
      # found a real defect — CLAUDE.md referenced a charter path that did not exist. That is
      # the dogfooding loop, and it was running by hand or not at all.
      - run: npm run selfcheck

      # Enforcee, installed on Enforcee. `76-ENGINE-PLAN` Part 0: `.claude/` did not exist, so
      # we were selling a hook that blocks a forbidden action and building with no hook.
      #
      # This compiles our own CLAUDE.md into `.enforcee/policy.json` through the same library
      # the shipped CLI uses, and REFUSES to install when the ruleset parses implausibly few
      # rules. So a parser regression that would quietly empty every customer's policy turns
      # this step red on the commit that caused it, instead of shipping a guard that guards
      # nothing — which is invisible from the outside and passes every other check.
      - run: npm run dogfood

      # `verify:ui` builds, serves, renders every page in both themes in real Chromium and
      # SAMPLES PAINTED PIXELS. It exists because of the `.invert` disaster: a custom class
      # collided with Tailwind's `filter: invert(100%)`, every panel painted backwards, and
      # 546 contrast measurements plus 123 unit assertions stayed green throughout —
      # getComputedStyle reports values before filters, and a filter inverts foreground and
      # background together, preserving the ratio exactly. Only a sampled pixel disagreed.
      #
      # It is the only control we own that reads the layer the user actually sees. Ubuntu
      # only: it needs a Chromium download, and paying that on three runners to re-test one
      # renderer is cost without information.
      #
      # The runner has no browser until we ask for one, and the scripts used to hardcode
      # `/opt/pw-browsers/chromium-1194/...` — the path in the sandbox this is built in,
      # pinned to a build number. That is why the first CI run of this step went red.
      # scripts/chrome.mjs now resolves it, and falls through to Playwright's own answer.
      # A green suite says nothing about whether its controls CAN go red. Seven controls on
      # this project have now passed over the exact thing they were written to catch — the
      # most recent kept main red on windows-latest for two commits while a rule named
      # "never execFiles a .cmd or .bat, even by explicit name" sat green, because the
      # literal was one line away from the call and the regex was line-scoped.
      #
      # `sabotage` removes each fix in turn, ASSERTS the removal actually applied (a replace
      # that matches nothing otherwise reports "control passed" from a sabotage that never
      # happened — that has occurred here), and requires the named test to go red. Running
      # it by hand is a thing someone has to remember, which is the category of control this
      # product exists because models ignore.
      #
      # Ubuntu only: it re-runs test files many times, and the property it establishes —
      # can this control fail — is not platform-specific.
      - run: npm run sabotage
        if: matrix.os == 'ubuntu-latest'

      - run: npx playwright install --with-deps chromium
        if: matrix.os == 'ubuntu-latest'

      - run: npm run verify:ui
        if: matrix.os == 'ubuntu-latest'
