name: Email templates

# Push the four Supabase auth email templates from this repo into the live project.
#
# ── Why this runs here and not from a laptop ──
#
# Patrik has pasted these templates into the Supabase dashboard by hand three times. Each
# round cost a live bug — the SVG logo, then the hosted PNG — and the last round he could
# not do at all, because he was on a phone and you cannot select sixty lines of HTML out of
# a chat transcript on a phone.
#
# The obvious fix was to run `npm run email:push` from the build sandbox. That does not
# work and will not: api.supabase.com is refused at the network layer with
# `x-deny-reason: host_not_allowed`, and the proxy bypass that unlocks github.com does not
# help. Tested, not assumed.
#
# A GitHub runner has ordinary internet. So the job runs here, the token lives in GitHub's
# secret store rather than in a chat transcript, and the whole thing is a button on a phone.
#
# ── The secret ──
#
# SUPABASE_ACCESS_TOKEN — a Supabase personal access token, prefix `sbp_`, from
# https://supabase.com/dashboard/account/tokens
#
# Supabase's own docs: "PATs carry the same privileges as your user account, so be sure to
# keep it secret." That is a full-account credential, so: give it a short expiry, and revoke
# it the moment it stops being useful. It is never printed by the script or this workflow.

on:
  # The button. Actions -> Email templates -> Run workflow.
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = report drift only. push = write them to Supabase.'
        type: choice
        options: [check, push]
        default: check

  # Drift detection. Changing a template in git without pushing it to Supabase leaves two
  # copies of one thing that disagree — the duplicated-source bug, of which this project has
  # had ten. This makes the dashboard's copy an assertion rather than a hope.
  push:
    branches: [main]
    paths: ['supabase/email/**', 'scripts/push-email-templates.mjs']

jobs:
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # A missing secret must not read as "the templates are in sync". That is the
      # scan-matched-nothing failure in workflow form, and this project has shipped six of
      # those. Say plainly that nothing was checked, and stop.
      #
      # Tested in the shell rather than in an `if:` expression: the `secrets` context is not
      # reliably available in a step-level condition, and a condition that silently evaluates
      # to false would SKIP this guard — turning the check meant to catch a missing token
      # into the thing that hides it. A shell test has no such ambiguity.
      - name: Require the token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::No SUPABASE_ACCESS_TOKEN secret. NOTHING WAS CHECKED — this is not a pass."
            echo "Add it at: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Get one at: https://supabase.com/dashboard/account/tokens  (prefix sbp_)"
            exit 1
          fi
          echo "token present (${#SUPABASE_ACCESS_TOKEN} chars)"

      # On a push we only ever report. Writing to a live project must stay a deliberate act,
      # never a side effect of merging.
      - name: Check for drift
        if: github.event_name == 'push' || inputs.mode == 'check'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run email:check

      # PATCHes all four, then READS THEM BACK. A 200 from a PATCH is the API's opinion;
      # the read-back is the fact. Never report a step as done without checking the thing it
      # was supposed to change.
      - name: Push to Supabase
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'push'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run email:push
