name: Publish to npm

# Publishes on a v* tag. One credential, stored once in this repository's Actions secrets,
# used only by this workflow, never held by a person and never pasted into a chat.
#
# Why a token and not OIDC trusted publishing: OIDC needs a configuration on npmjs.com that
# only the package owner can see. Three runs failed with a misleading `E404 Not Found` — the
# response npm gives an unauthenticated PUT — and the config could not be inspected from
# outside to find the mismatch. A working release beats an elegant one that costs an
# afternoon. The OIDC block is kept below, commented out, so it can be switched on later
# without rediscovering any of this.
#
# To rotate: npmjs.com → Access Tokens → revoke, create a new granular token, then replace
# NPM_TOKEN under Settings → Secrets and variables → Actions. Nothing else changes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Called by auto-release.yml once its gate passes. A tag pushed with the default
  # GITHUB_TOKEN does not trigger a workflow — GitHub suppresses that to stop recursion — so
  # the gate calls this one directly instead of tagging and hoping. One publish path either
  # way: the credential, the three-OS pre-publish gate and the pack checks all stay here.
  workflow_call:

jobs:
  # THE RELEASE GATE RUNS ON EVERY SUPPORTED PLATFORM, NOT JUST THE CHEAP ONE.
  #
  # The three-OS matrix lived in ci.yml, which runs on push and does NOT block a release. So
  # a version with a known Windows failure could still publish, and the answer to "why do the
  # same errors keep turning up in the latest update" was: because nothing stopped them.
  #
  # Five POSIX assumptions shipped this way — .pathname, `sh`, startsWith('/'), a walker
  # returning backslashes, and npm-is-npm.cmd — each found one release after the last.
  # Whack-a-mole is what you get when the gate tests one platform and the users have three.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Enforcee audits its own ruleset. If the product cannot pass its own rules, it does
      # not ship — and a failure here is a finding about the product, not about the rules.
      - run: npm run selfcheck

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm ci

      # The full suite, then the pre-publish checks. The pack script refuses to publish on
      # any of them, including a runtime probe that stubs http/https/net/tls/fetch and fails
      # if a free audit opens a socket. CI is where this gets enforced rather than remembered.
      - run: npm test
      - run: npm run pack:cli

      - run: npm publish ./npm-dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

# ── Later: trusted publishing, no token at all ──────────────────────────────────────────
# Add `permissions: { contents: read, id-token: write }` to the job, drop the NODE_AUTH_TOKEN
# env block, and on npmjs.com set Packages → enforcee → Settings → Trusted publishing to:
#   Organization or user : 7patriksz-art
#   Repository           : Enforcee          (case-sensitive)
#   Workflow filename    : publish.yml
#   Environment          : leave blank — if this is set, the job needs a matching
#                          `environment:` key or the handshake fails with the same E404
# npm does not validate that form when saved, which is why a mismatch surfaces only as a
# failed publish. Requires npm >= 11.5.1, which Node 24 ships.
